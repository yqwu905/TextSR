# TextSR Small-Scale Config (TextZoom dataset, multi-GPU)

data:
  dataset: textzoom
  data_root: ./data/TextZoom          # path to TextZoom dataset root
  ocr_annotation_dir: ./data/ocr_annotations
  train_hr_size: [48, 480]            # [H, W] - training HR crop size
  sr_factor: 2                        # super-resolution upscale factor
  max_text_length: 64                 # max OCR text token length (bytes)
  ocr_backend: paddleocr              # ocr backend for text conditioning
  num_workers: 8

model:
  # ByT5 text encoder
  byt5_model: google/byt5-base
  byt5_num_layers: 2                  # only use first N encoder layers
  text_embed_dim: 1536                # ByT5-base hidden dim
  max_text_len: 64

  # U-Net denoiser
  unet:
    in_channels: 6                    # 3 (noisy residual) + 3 (LR upsampled)
    out_channels: 3
    base_channels: 32
    channel_mult: [1, 2, 4, 8, 8]    # 5 down/up block pairs
    num_res_blocks: 2
    attention_levels: [3, 4]          # apply cross-attention at these down levels (0-indexed)
    cross_attention_dim: 256          # project text features to this dim for cross-attention
    dropout: 0.0
    time_embed_dim: 256

  # Diffusion
  diffusion:
    timesteps: 1000
    beta_schedule: linear             # linear or cosine
    beta_start: 0.0001
    beta_end: 0.02
    prediction_type: epsilon          # predict noise (epsilon) or x0
    ddim_steps: 5                     # fast inference steps

training:
  batch_size: 16                      # per-GPU batch size
  learning_rate: 3.0e-4
  num_epochs: 100
  warmup_steps: 1000
  grad_clip: 1.0
  ema_decay: 0.9999
  log_interval: 100
  save_interval: 5                    # save checkpoint every N epochs
  checkpoint_dir: ./checkpoints
  output_dir: ./outputs
  fp16: true                          # mixed precision training

  # Classifier-free guidance training
  text_drop_prob: 0.1                 # probability to drop text condition
  image_drop_prob: 0.0               # keep image condition always

inference:
  ddim_steps: 5
  cfg_weight: 2.0                     # ω in the paper (text guidance scale)
  iterative_ocr_rounds: 1            # R in the paper (0=direct LR OCR, 1=one refinement)
  output_dir: ./outputs/inference

evaluation:
  textzoom_test_dir: ./data/TextZoom/test  # path to TextZoom test set
  output_dir: ./outputs/eval
  recognizers: [paddleocr]          # text recognizers for evaluation
